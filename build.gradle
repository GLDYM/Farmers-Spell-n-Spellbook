plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id("net.neoforged.moddev") version "2.0.140"
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'farmers-spell-n-spellbook'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
neoForge {
    version = project.neo_forge_version

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        clientWorld {
            client()
            programArguments.addAll '--quickPlayPath', 'quickplay/modporter_smoke_world.json', '--quickPlaySingleplayer', 'modporter_smoke_world'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.matching { it.name == 'prepareGameTestServerRun' }.configureEach {
    doLast {
        def gameTestStructures = file('src/main/resources/gameteststructures')
        if (gameTestStructures.exists()) {
            copy {
                from gameTestStructures
                into file('run/gameteststructures')
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.saps.dev/releases' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://code.redspace.io/snapshots' }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { 
        name = "CuriosMaven"
        url = "https://maven.theillusivec4.top/" 
    }
    maven {
        name = "Geckolib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven {
        name = "Latvian Maven"
        url = "https://maven.latvian.dev/releases"
    }
}

dependencies {
    // Dependencies for the mod
    // Farmers Delight
    implementation "maven.modrinth:farmers-delight:1.21.1-1.3.2"

    // Iron's Spells 'n Spellbooks
    implementation "curse.maven:irons-spells-n-spellbooks-855414:8364935"
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1"
    implementation "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    implementation "io.redspace:irons_lib:1.21.1-2.1.0-SNAPSHOT"

    // Integration with other mods
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // EMI
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // Patchouli
    compileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE:api"
    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    // KubeJS
    // compileOnly "dev.latvian.mods:rhino:2101.2.7-build.72"
    // compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    runtimeOnly "dev.latvian.mods:rhino:2101.2.7-build.72"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"

    // Botany Pots
    runtimeOnly "maven.modrinth:bookshelf-lib:1sdJl7J1"
    runtimeOnly "maven.modrinth:prickle:EE1FHDyD"
    runtimeOnly "maven.modrinth:botany-pots:RjHfHgSn"

    // Runtime tools
    // ALI
    runtimeOnly "curse.maven:advanced-loot-info-1205426:7938903"
    // Export
    runtimeOnly "curse.maven:let-me-see-see-your-code-1229018:6777654"
    // Catalogue
    runtimeOnly "curse.maven:catalogue-459701:6926815"

    //runtimeOnly "curse.maven:kaleidoscope-cookery-1309203:7473809"
    //runtimeOnly "curse.maven:jade-324717:5813144"
    //runtimeOnly "curse.maven:just-enough-effect-descriptions-jeed-532286:6172935"
    //runtimeOnly "curse.maven:appleskin-248787:4770828"
    //runtimeOnly "curse.maven:architectury-419699:5137938"
    //runtimeOnly "curse.maven:AdvancedLootInfo-forge-1205426:8168726"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_forge_version: neo_forge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
