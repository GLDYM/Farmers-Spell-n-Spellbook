modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="banner.png"
logoBlur = false
#credits=""
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties.${mod_id}]
catalogueImageIcon = "logo.png"

[[mixins]]
config="farmers_spell.mixins.json"

[[dependencies.${mod_id}]] 
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="[1.3.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="required"
    versionRange="[1.21.1-3.16.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.9.2,)"
    ordering="AFTER"
    side="BOTH"
